name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package site (exclude dev files)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' --exclude 'node_modules' \
            --exclude 'scripts' --exclude '.github' --exclude 'package*.json' \
            --exclude 'eslint.config.js' --exclude 'requirements.txt' \
            --exclude 'data/sources' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
